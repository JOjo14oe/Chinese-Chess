<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="中国象棋联机对战网页版：纯前端零依赖，棋盘绘制、中文记谱、断线重连。">
<title>中国象棋 · 联机对战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-seal" aria-hidden="true"><span class="brand-seal-text">象</span></span>
    <span class="brand-names">
      <b class="brand-title">中国象棋</b>
      <span class="brand-sub">联机对战 · 网页版</span>
    </span>
  </div>
  <div class="topbar-right">
    <div id="conn" class="conn conn-idle" role="status" aria-live="polite">
      <span class="conn-dot" aria-hidden="true"></span>
      <span id="conn-text">未连接</span>
    </div>
    <button id="btn-flip" class="btn btn-ghost btn-small" type="button" title="翻转棋盘视角">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 5.2h8.9M9.3 3l2.2 2.2-2.2 2.2M13.4 10.8H4.5M6.7 13l-2.2-2.2 2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>翻转</span>
    </button>
  </div>
</header>

<main class="layout">
  <!-- ============================ 棋盘 ============================ -->
  <section class="board-wrap">
    <div id="board-shell" class="board-shell">
      <canvas id="board" aria-label="中国象棋棋盘"></canvas>
      <div id="board-overlay" class="board-overlay" hidden>
        <div class="overlay-card">
          <p id="overlay-text" class="overlay-text"></p>
          <button id="overlay-flip" class="btn btn-small" type="button">翻转视角</button>
        </div>
      </div>
    </div>
    <p id="board-hint" class="board-hint">正在准备棋盘…</p>
  </section>

  <!-- ============================ 侧栏 ============================ -->
  <aside class="panel">

    <!-- 起始屏：没有房间时显示。同一个页面同时提供「单机」与「联机」两种模式 -->
    <section id="start" class="card card-start">
      <h2 class="card-title">开始对局</h2>

      <div class="mode-switch" role="tablist" aria-label="对局模式">
        <button id="mode-offline" class="mode-btn is-on" type="button" role="tab">单机对局</button>
        <button id="mode-online" class="mode-btn" type="button" role="tab">联机房间</button>
      </div>

      <div id="start-offline" class="mode-pane">
        <p class="card-note">单机模式<b>完全在这个页面里运行</b>：规则引擎与电脑对手都在浏览器内，不连服务器。</p>
        <div class="field-row">
          <label for="off-level">难度</label>
          <select id="off-level" class="select">
            <option value="easy">入门</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
        </div>
        <div class="field-row">
          <label for="off-side">我执</label>
          <select id="off-side" class="select">
            <option value="r" selected>红方（先手）</option>
            <option value="b">黑方（后手）</option>
          </select>
        </div>
        <div class="field-row">
          <label for="off-opponent">对手</label>
          <select id="off-opponent" class="select">
            <option value="ai" selected>电脑</option>
            <option value="human">同屏双人</option>
          </select>
        </div>
        <div class="btn-row">
          <button id="btn-offline" class="btn btn-primary" type="button">开始单机对局</button>
        </div>
        <p class="card-note card-note-dim">同一套棋盘与记谱；想要和朋友联机，切到「联机房间」即可。</p>
      </div>

      <div id="start-online" class="mode-pane" hidden>
        <p class="card-note">创建一个新房间，或输入 6 位房间号加入好友的棋局。</p>
        <div class="field">
          <label for="room-input">房间号</label>
          <input id="room-input" class="room-input" type="text" inputmode="latin" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" maxlength="6" placeholder="例如 A7K2QM">
        </div>
        <div class="btn-row">
          <button id="btn-create" class="btn btn-primary" type="button">创建房间</button>
          <button id="btn-join" class="btn" type="button">加入房间</button>
        </div>
        <p class="card-note card-note-dim">房间号由 A–Z（不含 B、I、O）与 2–9 组成，双方各执红黑，服务器权威判定胜负。</p>
      </div>

      <p id="start-error" class="alert alert-error" role="alert" hidden></p>
    </section>

    <!-- 对局面板：进入房间后显示 -->
    <section id="game" class="card card-game" hidden>

      <div id="room-bar" class="room-bar">
        <div class="room-code-wrap">
          <span class="label">房间号</span>
          <b id="room-code" class="room-code">------</b>
        </div>
        <button id="btn-copy" class="btn btn-small" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="2.6" width="8" height="9.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.6" y="4.4" width="8" height="9.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span id="copy-label">复制房间链接</span>
        </button>
      </div>

      <p id="status-line" class="status-line">等待连接…</p>

      <ul class="seats">
        <li class="seat" id="seat-top">
          <span class="seat-dot" aria-hidden="true"></span>
          <span class="seat-side">黑方</span>
          <span class="seat-name">空位</span>
          <span class="seat-tag">对手</span>
        </li>
        <li class="seat" id="seat-self">
          <span class="seat-dot" aria-hidden="true"></span>
          <span class="seat-side">红方</span>
          <span class="seat-name">空位</span>
          <span class="seat-tag">你</span>
        </li>
      </ul>

      <p id="alert" class="alert alert-info" role="alert" hidden></p>
      <p id="result" class="result" role="alert" hidden></p>

      <div class="section">
        <div class="section-head">
          <h3 class="section-title">着法记录</h3>
          <span id="move-count" class="section-note">0 手</span>
        </div>
        <div id="movelist" class="movelist" tabindex="0" aria-label="中文记谱着法列表"></div>
      </div>

      <div class="actions">
        <button id="btn-new" class="btn" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.4V5.6H9.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>新局</span>
        </button>
        <button id="btn-undo" class="btn" type="button" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 3.4 3.4 6.6l3.2 3.2M3.6 6.6h5.2a3.6 3.6 0 0 1 0 7.2H6.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>悔棋</span>
        </button>
        <button id="btn-resign" class="btn btn-warn" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 14V2.2M4.2 2.8h8.3L10.3 6l2.2 3.2H4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>认输</span>
        </button>
        <button id="btn-leave" class="btn btn-ghost" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 2.6h2.8A1.2 1.2 0 0 1 13.4 3.8v8.4a1.2 1.2 0 0 1-1.2 1.2H9.4M6.6 5.4 3.4 8l3.2 2.6M3.6 8h6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>退出房间</span>
        </button>
      </div>

      <footer class="meta">
        <span id="meta-seq">记谱序号：—</span>
        <span id="meta-side">你执红</span>
      </footer>
    </section>
  </aside>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="logic.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
