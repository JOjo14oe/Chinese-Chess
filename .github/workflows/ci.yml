name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12', '3.13']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 环境信息（确认零第三方依赖）
        run: |
          python -VV
          python -c "import sys; print('modules:', len(sys.modules))"
      - name: 自检（perft 1-3 + 规则 + 记谱 + 引擎一步杀）
        run: python main.py --selftest
      - name: 全量测试（图形界面测试与 perft(4) 默认跳过）
        run: python -m unittest discover -s tests -t . -v

  deep:
    name: 深度校验 · perft(4)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      XQ_PERFT4: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: perft(4) 基准比对（约 40-90 秒）
        run: python -m unittest discover -s tests -t . -p "test_perft.py" -v
